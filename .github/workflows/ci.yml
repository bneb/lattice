# =============================================================================
# Lattice CI — Build Verification
# =============================================================================
# Triggered on push/PR to main. Builds salt-front (Rust) and salt-opt (C++/MLIR)
# on Linux and macOS to verify cross-platform compatibility.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LLVM_VERSION: "21"

jobs:
  build-salt-front:
    name: Build salt-front (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('salt-front/Cargo.lock') }}

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Run salt-front tests
        run: cargo test --release
        working-directory: salt-front

      - name: Run Z3 contract regression tests
        run: |
          SALTC=./target/release/saltc \
            bash tests/z3_contracts/run_tests.sh
        working-directory: salt-front

      - name: Upload saltc binary
        uses: actions/upload-artifact@v4
        with:
          name: saltc
          path: salt-front/target/release/saltc

  build-salt-front-macos:
    name: Build salt-front (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('salt-front/Cargo.lock') }}

      - name: Install dependencies
        run: brew install z3

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Run salt-front tests
        run: cargo test --release
        working-directory: salt-front

  build-salt-front-windows:
    name: Build salt-front (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('salt-front/Cargo.lock') }}

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Run salt-front tests
        run: cargo test --release
        working-directory: salt-front

      - name: Verify runtime_win.c compiles
        run: clang -c runtime_win.c -o runtime_win.o
        working-directory: salt-front

  build-salt-opt:
    name: Build salt-opt (C++/MLIR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 + MLIR + Z3
        run: |
          # Add LLVM apt repository for LLVM 21
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev \
            libmlir-21-dev \
            mlir-21-tools \
            libclang-21-dev \
            clang-21 \
            lld-21 \
            libz3-dev \
            libzstd-dev \
            cmake \
            ninja-build

      - name: Symlink LLVM tools
        run: |
          for tool in llc clang clang++ opt mlir-opt; do
            sudo ln -sf "/usr/bin/${tool}-21" "/usr/bin/${tool}" 2>/dev/null || true
          done
          sudo ln -sf /usr/bin/lld-21 /usr/bin/lld
          sudo ln -sf /usr/bin/ld.lld-21 /usr/bin/ld.lld

      - name: Build salt-opt
        run: |
          mkdir -p salt/build && cd salt/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ninja salt-opt

      - name: Upload salt-opt binary
        uses: actions/upload-artifact@v4
        with:
          name: salt-opt
          path: salt/build/salt-opt

  build-salt-lsp:
    name: Build salt-lsp (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/salt-lsp/target
          key: ${{ runner.os }}-lsp-cargo-${{ hashFiles('tools/salt-lsp/Cargo.lock') }}

      - name: Build salt-lsp
        run: cargo build --release
        working-directory: tools/salt-lsp

      - name: Run salt-lsp tests
        run: cargo test --release
        working-directory: tools/salt-lsp

  build-sp:
    name: Build sp (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/sp/target
          key: ${{ runner.os }}-sp-cargo-${{ hashFiles('tools/sp/Cargo.lock') }}

      - name: Build sp
        run: cargo build --release
        working-directory: tools/sp

      - name: Run sp tests
        run: cargo test --release
        working-directory: tools/sp

  clippy:
    name: Clippy lints (salt-front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
          key: ${{ runner.os }}-clippy-${{ hashFiles('salt-front/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: salt-front

  kernel-smoke-test:
    name: Kernel smoke test (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-salt-opt]
    steps:
      - uses: actions/checkout@v4

      - name: Download salt-opt artifact
        uses: actions/download-artifact@v4
        with:
          name: salt-opt
          path: salt/build

      - name: Make salt-opt executable
        run: chmod +x salt/build/salt-opt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev mlir-21-tools clang-21 lld-21 libz3-dev

      - name: Symlink LLVM tools
        run: |
          for tool in llc clang clang++ opt mlir-opt; do
            sudo ln -sf "/usr/bin/${tool}-21" "/usr/bin/${tool}" 2>/dev/null || true
          done
          sudo ln -sf /usr/bin/lld-21 /usr/bin/lld

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Build kernel
        run: python3 tools/runner_qemu.py build
        timeout-minutes: 10

      - name: Boot kernel in QEMU (smoke test)
        run: |
          qemu-system-x86_64 -kernel qemu_build/kernel.elf -display none \
            -serial stdio -m 256M -no-reboot 2>&1 | tee /tmp/qemu_boot.log &
          QEMU_PID=$!
          # Wait up to 30s for the kernel to print boot marker
          for i in $(seq 1 30); do
            if grep -q "=== KeuOS" /tmp/qemu_boot.log 2>/dev/null; then
              echo "Kernel booted successfully"
              kill $QEMU_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "=== QEMU output (first 200 lines) ==="
          head -200 /tmp/qemu_boot.log || echo "(no output)"
          echo "=== End QEMU output ==="
          kill $QEMU_PID 2>/dev/null || true
          exit 1

  coverage:
    name: Code coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (required for llvm-tools-preview)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
            tools/salt-lsp/target
          key: ${{ runner.os }}-coverage-${{ hashFiles('salt-front/Cargo.lock', 'tools/salt-lsp/Cargo.lock') }}

      - name: Run coverage (salt-front)
        run: cargo llvm-cov --fail-under-lines 60
        working-directory: salt-front

      - name: Run coverage (salt-lsp)
        run: cargo llvm-cov --fail-under-lines 50
        working-directory: tools/salt-lsp

  benchmark:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-21-dev mlir-21-tools clang-21 lld-21 libz3-dev

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Run benchmark CI suite
        run: bash tools/bench_infra/benchmark_ci.sh

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/benchmark_ci_results.json

  lettuce-check:
    name: Lettuce module compilation + Z3 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            salt-front/target
          key: ${{ runner.os }}-lettuce-cargo-${{ hashFiles('salt-front/Cargo.lock') }}

      - name: Build salt-front
        run: cargo build --release
        working-directory: salt-front

      - name: Run lettuce-check
        run: make lettuce-check
