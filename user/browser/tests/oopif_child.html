<!DOCTYPE html>
<html>
<body style="background-color: #ff0055; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; margin: 0; overflow: hidden;">
    <h2 style="font-size: 1.5rem; text-shadow: 0 0 10px rgba(0,0,0,0.3);">Isolated Renderer</h2>
    <div style="font-size: 0.8rem; opacity: 0.8;">PID: [Managed by Sandbox]</div>
    <div id="log" style="margin-top: 20px; font-family: monospace; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; width: 80%;">
        System Init...
    </div>

    <script>
        const log = document.getElementById('log');
        function print(msg) {
            log.textContent = msg;
            console.log('Child:', msg);
        }

        // Start Handshake
        setTimeout(() => {
            print('Sending BRIDGE_ESTABLISHED...');
            window.parent.postMessage('BRIDGE_ESTABLISHED', '*');
        }, 500);

        window.addEventListener('message', (event) => {
            print('Recv from Parent: ' + event.data);
            try {
                const cmd = JSON.parse(event.data);
                if (cmd.type === 'CMD_UPGRADE') {
                    setTimeout(() => {
                        print('Sending UPGRADE_COMPLETE...');
                        window.parent.postMessage('UPGRADE_COMPLETE', '*');
                        document.body.style.backgroundColor = '#00ff88';
                        document.body.style.color = '#000';
                    }, 500);
                }
            } catch(e) {
                print('Error: Invalid Command');
            }
        });
    </script>
</body>
</html>
