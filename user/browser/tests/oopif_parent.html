<!DOCTYPE html>
<html>
<body style="background-color: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <h1 id="status" style="font-size: 3rem; text-shadow: 0 0 20px #00d2ff;">Sandbox Matrix</h1>
    <div style="padding: 20px; border: 2px solid #00d2ff; border-radius: 12px; background: rgba(0, 210, 255, 0.1);">
        <p id="msg-box">Waiting for OOPIF Handshake...</p>
        <iframe id="oopif" src="oopif_child.html" style="width: 400px; height: 300px; border: 4px solid #fff; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5);"></iframe>
    </div>
    
    <script>
        const status = document.getElementById('status');
        const msgBox = document.getElementById('msg-box');
        const iframe = document.getElementById('oopif');

        window.addEventListener('message', (event) => {
            console.log('Parent received:', event.data);
            if (event.data === 'BRIDGE_ESTABLISHED') {
                msgBox.textContent = 'Child Signaling: Bridge Established!';
                msgBox.style.color = '#00ff88';
                
                // Stress test: Send a large JSON payload after 1s
                setTimeout(() => {
                    const payload = { type: 'CMD_UPGRADE', version: '2.0', status: 'STABLE' };
                    iframe.contentWindow.postMessage(JSON.stringify(payload), '*');
                    msgBox.textContent = 'Parent -> Child: CMD_UPGRADE sent.';
                }, 1000);
            }
            
            if (event.data === 'UPGRADE_COMPLETE') {
                status.textContent = 'OOPIF STABLE';
                status.style.color = '#00ff88';
                msgBox.textContent = 'Full Bidirectional Bridge Verified.';
                document.body.style.background = 'radial-gradient(circle, #0f2027, #203a43, #2c5364)';
            }
        });
    </script>
</body>
</html>
