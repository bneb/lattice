[package]
name = "salt-front"
version = "0.8.0"
edition = "2021"

[features]
default = ["z3-backend"]
z3-backend = ["dep:z3"]

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
anyhow = "1.0"
arbitrary = { version = "1.4.2", features = ["derive"] }
z3 = { version = "0.12", optional = true }

[dev-dependencies]
insta = "1.0"
libfuzzer-sys = "0.4.10"
paste = "1.0.15"
tempfile = "3.24.0"
walkdir = "2.3"

[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
inherent_to_string = "allow"
type_complexity = "allow"
# Pre-existing style nits — fixed incrementally as files are refactored
collapsible_match = "allow"  # 3 remaining (async_lower, mod.rs) — 14 of 22 fixed
collapsible_if = "allow"     # 5 remaining (mod.rs, expr/mod) — fixed elsewhere

