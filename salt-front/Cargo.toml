[package]
name = "salt-front"
version = "0.8.0"
edition = "2021"

[features]
default = ["z3-backend"]
z3-backend = ["dep:z3"]

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
anyhow = "1.0"
arbitrary = { version = "1.4.2", features = ["derive"] }
z3 = { version = "0.12", optional = true }

[dev-dependencies]
insta = "1.0"
libfuzzer-sys = "0.4.10"
paste = "1.0.15"
tempfile = "3.24.0"
walkdir = "2.3"

[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
inherent_to_string = "allow"
type_complexity = "allow"
# Pre-existing style nits — fixed incrementally as files are refactored
collapsible_match = "allow"  # 20 remaining — pattern merge works, needs dedicated /loop
collapsible_if = "allow"     # 2 fixed as POC, rest queued
# single_match = "allow"
# ptr_arg = "allow"
# needless_late_init = "allow"
# needless_range_loop = "allow"
manual_map = "allow"
# manual_is_multiple_of = "allow"
if_same_then_else = "allow"
# manual_clamp = "allow"
useless_conversion = "allow"
write_with_newline = "allow"
uninlined_format_args = "allow"
unnecessary_filter_map = "allow"
only_used_in_recursion = "allow"
# manual_strip = "allow"
new_without_default = "allow"
cloned_ref_to_slice_refs = "allow"
should_implement_trait = "allow"
match_like_matches_macro = "allow"
doc_lazy_continuation = "allow"
# format_in_format_args = "allow"

